<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Twisty Player Interactive Test</title>
    <style>
        body { margin: 0; background: #12141a; color: #fff; font-family: sans-serif; padding: 20px; }
        #debug-log { white-space: pre-wrap; background: #222; padding: 10px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #444; font-size: 13px; }
        .cube-container { width: 340px; height: 340px; border: 2px solid #00e676; border-radius: 12px; background: #000; overflow: hidden; position: relative; margin: 0 auto; }
        twisty-player { width: 100%; height: 100%; }
        .controls { text-align: center; margin-top: 15px; }
        button { background: #3875f6; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin: 0 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Local cubing.js 3D TwistyPlayer Interactive Test</h2>
    <div id="debug-log"></div>
    <div class="cube-container">
        <twisty-player
            id="player"
            puzzle="3x3x3"
            alg="R U R' U' R' F R2 U' R' U' R U R' F'"
            experimental-setup-anchor="end"
            background="none"
            control-panel="none"
            camera-latitude="25"
            camera-longitude="20"
        ></twisty-player>
    </div>
    <div class="controls">
        <button id="btn-start">⏮ 起点</button>
        <button id="btn-prev">◀ 上一步</button>
        <button id="btn-play">▶ 播放/暂停</button>
        <button id="btn-next">下一步 ▶</button>
        <button id="btn-end">⏭ 终点</button>
    </div>
    <script type="module">
        const log = (msg) => {
            console.log(msg);
            document.getElementById('debug-log').textContent += msg + '\n';
        };
        try {
            await import('./static/cubing-twisty.js');
            log('cubing-twisty.js loaded!');
            const p = document.getElementById('player');
            
            // Wire buttons
            document.getElementById('btn-start').onclick = () => p.jumpToStart();
            document.getElementById('btn-end').onclick = () => {
                if (p.jumpToEnd) p.jumpToEnd();
                else p.controller.animationController.jumpToEnd();
            };
            document.getElementById('btn-prev').onclick = () => {
                p.controller.animationController.play({ direction: -1, untilBoundary: 1 });
            };
            document.getElementById('btn-next').onclick = () => {
                p.controller.animationController.play({ direction: 1, untilBoundary: 1 });
            };
            document.getElementById('btn-play').onclick = () => {
                const anim = p.controller.animationController;
                if (anim.playing) anim.pause();
                else anim.play();
            };
            
            // Track cursor
            setTimeout(() => {
                const cursor = p.experimentalModel?.cursor?.pos;
                if (cursor && typeof cursor.subscribe === 'function') {
                    cursor.subscribe((val) => {
                        log('Cursor position: ' + val);
                    });
                }
                log('Initial setup complete. Ready to interact.');
            }, 600);
        } catch (e) {
            log('Error: ' + e);
        }
    </script>
</body>
</html>
